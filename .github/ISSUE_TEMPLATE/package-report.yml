name: Extension or Skill Report
description: Report an unsafe or incompatible third-party resource
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for a third-party Extension, Skill or Pi Package used with Pi Trainer. For project bugs, use the bug report template. Do not include credentials or private training data.

  - type: input
    id: package-name
    attributes:
      label: Resource name or source
      description: npm package, Git repository, local package name or Skill name.
      placeholder: "npm:@scope/package or https://github.com/user/repo"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version or commit
      description: Exact version, tag or commit if known.
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Compatibility failure
        - Impersonation or misleading identity
        - Undeclared tool or data access
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern, affected boundary and reproducible evidence.
    validations:
      required: true
