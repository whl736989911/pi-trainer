name: Bug Report
description: Report a reproducible Pi Trainer problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/whl736989911/pi-trainer/blob/main/CONTRIBUTING.md) before submitting. Remove credentials, Tokens, Session content and user files from logs.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Skill Trainer conversation or documents
        - Formal replay or sandbox
        - Feishu/Lark gateway
        - Terminal or CLI
        - Model provider
        - Build or test
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the exact error and why it affects Pi Trainer.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible case.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, OS, Node.js version and run mode (TUI, Lark, RPC or SDK).
    validations:
      required: true
