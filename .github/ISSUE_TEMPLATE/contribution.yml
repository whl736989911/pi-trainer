name: Contribution Proposal
description: Propose a Pi Trainer change before submitting a large PR
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/whl736989911/pi-trainer/blob/main/CONTRIBUTING.md). Keep Lark and Skill Trainer internally modular and avoid unnecessary Pi core changes.

  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: Describe the user-visible outcome.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      description: Explain how it improves document quality, traceability, Lark operation or formal replay.
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: Proposed approach
      description: Include module boundaries, migration and rollback considerations.
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: List normal, boundary and platform-specific tests.
    validations:
      required: true
